# Builds the site on every pull request and on every push to main.
# `npm run check` = type check + build + search index (Pagefind) + strict link check.
# If it fails, the PR must not be merged.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
